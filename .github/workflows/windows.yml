# Builds, tests and packages the Windows build.
#
# It is the honest way to check the app on a machine that is not the author's, and it produces the
# artifact that is packaged for the Microsoft Store. The macOS build keeps its own release process;
# this workflow only touches windows/.
name: Windows

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows.yml"
  pull_request:
    paths:
      - "windows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Toolchain actually in use
        run: dotnet --info

      - name: Build
        run: dotnet build SA-Sur.slnx -c Release

      # The device tests are endpoint-gated, so they stand down on a runner with no sound hardware
      # rather than failing for an environmental reason. The maths, the DSP, the audio path, the
      # layout geometry and the app host are all covered without one.
      - name: Test
        run: dotnet test SA-Sur.slnx -c Release --no-build

      - name: Publish the single-file executable
        run: >
          dotnet publish SA-Sur.App/SaSur.App.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o build/win-x64

      - name: Report the artifact and its digest
        shell: pwsh
        run: |
          $exe = Get-Item build/win-x64/SA-Sur.exe
          "artifact : $($exe.FullName)"
          "size     : {0:N0} bytes" -f $exe.Length
          "sha256   : $((Get-FileHash $exe -Algorithm SHA256).Hash.ToLower())"
          "version  : $($exe.VersionInfo.ProductVersion)"

      # No signing step: Windows trust comes from the Microsoft Store, which re-signs the MSIX that is
      # built from this artifact. See docs/CODE-SIGNING.md. The .exe published on the release page is
      # deliberately unsigned and is verified by the SHA-256 printed above.

      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: SA-Sur-win-x64
          path: windows/build/win-x64/SA-Sur.exe
          if-no-files-found: error
